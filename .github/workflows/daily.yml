name: Daily LeetCode Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI solver
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent/ai_solver.py

      - name: Save solution to GitHub
        run: |
          git config user.name "leetcode-ai-agent"
          git config user.email "leetcode-ai-agent@users.noreply.github.com"

          git add solutions/ data/solved.json

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add daily LeetCode solution"
            git push
          fi
